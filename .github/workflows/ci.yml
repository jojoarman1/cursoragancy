name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repo; deploy uses its own SSH key from secrets
permissions:
  contents: read

# Only the checks get cancelled by a newer run; deploy has its own group (see below)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: /home/vice/Frontend/dialog
  PM2_NAME: dialog
  # Same as PORT in ecosystem.config.cjs
  APP_PORT: 3010

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The server runs the build on Node 24, so it is built on the same line
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Third-party, so pinned to a commit: a moved tag could slip code into the deployed build
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # next build also type-checks
      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # The standalone server serves public/ and .next/static only when they sit next to it
      - name: Pack build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cp ecosystem.config.cjs .next/standalone/
          tar -cf build.tar -C .next/standalone .

      # The deploy job ships exactly the build checked here. A cache, not an artifact: artifacts
      # share the account's 500 MB quota with viceseason's
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          key: dialog-build-${{ github.sha }}
          path: build.tar

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Never cancelled halfway through the swap, and never two at once
    concurrency:
      group: deploy-dialog
      cancel-in-progress: false

    steps:
      - uses: actions/cache/restore@v6
        with:
          key: dialog-build-${{ github.sha }}
          path: build.tar
          fail-on-cache-miss: true

      - name: Unpack build
        run: mkdir build && tar -xf build.tar -C build && rm build.tar

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          # printf, not echo: the key comes with line breaks
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # The new build lands next to the live one as app.new; --link-dest hard-links the files that
      # didn't change, so only the difference is uploaded
      - name: Upload build
        run: |
          SSH="ssh -i ~/.ssh/id_deploy"
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          $SSH "$HOST" "mkdir -p '$APP_DIR'"
          rsync -az --delete --link-dest="$APP_DIR/app" -e "$SSH" build/ "$HOST:$APP_DIR/app.new/"

      # The live build is kept as app.prev until the new one answers
      - name: Swap and restart
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s -- "$APP_DIR" "$PM2_NAME" <<'EOF'
          set -euo pipefail
          cd "$1"
          rm -rf app.prev
          [ -d app ] && mv app app.prev || true
          mv app.new app
          # delete + start, not reload: one fork instance can't reload without downtime anyway,
          # and start re-reads the ecosystem file of the new build
          pm2 delete "$2" 2>/dev/null || true
          pm2 start app/ecosystem.config.cjs
          pm2 save
          EOF

      - name: Health check
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s -- "$APP_DIR" "$PM2_NAME" "$APP_PORT" <<'EOF'
          cd "$1"
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null -m 10 "http://127.0.0.1:$3/"; then
              rm -rf app.prev
              echo 'deploy ok'
              exit 0
            fi
            sleep 3
          done

          echo 'health check failed, rolling back' >&2
          pm2 logs "$2" --lines 40 --nostream || true
          if [ -d app.prev ]; then
            rm -rf app
            mv app.prev app
            pm2 delete "$2" 2>/dev/null || true
            pm2 start app/ecosystem.config.cjs
            pm2 save
          fi
          exit 1
          EOF
